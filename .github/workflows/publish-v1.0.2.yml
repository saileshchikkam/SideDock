name: Publish SideDock v1.0.2

# An explicit, one-time in-place refresh of the already public v1.0.2 release.
# Normal pushes and docs-only commits must NEVER silently replace an installer.
on:
  workflow_run:
    workflows: ["Windows build"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Require exact 1.0.2 version and approved republish marker
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -qx '__version__ = "1.0.2"' sidedock/version.py; then
            echo "Unrelated version; do not publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git log -1 --format=%B HEAD | grep -Fq '[republish-v1.0.2]'; then
            echo "Not an explicitly authorized v1.0.2 refresh; no asset changes."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release view v1.0.2 --repo "$GITHUB_REPOSITORY" >/dev/null
          count=$(gh release view v1.0.2 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
          if [ "$count" -ne 2 ]; then
            echo "Unexpected release asset count: $count" >&2
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Download the exact installer from successful main Windows build
        if: steps.preflight.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-asset
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name SideDock-Windows-Installer --dir release-asset
          test -s release-asset/SideDock-Setup-1.0.2.exe
          test "$(stat -c%s release-asset/SideDock-Setup-1.0.2.exe)" -gt 1000000
          test "$(head -c2 release-asset/SideDock-Setup-1.0.2.exe)" = "MZ"
          (cd release-asset && sha256sum SideDock-Setup-1.0.2.exe > SHA256SUMS.txt)
          cat release-asset/SHA256SUMS.txt

      - name: Replace assets in the existing v1.0.2 release (no duplicate release)
        if: steps.preflight.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Keep both public filenames and their URLs, while updating the
          # checksums and release notes. Never create an additional v1.0.2 tag.
          gh release upload v1.0.2 \
            release-asset/SideDock-Setup-1.0.2.exe \
            release-asset/SHA256SUMS.txt \
            --clobber --repo "$GITHUB_REPOSITORY"
          # The release source archive must match the published binary source.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v1.0.2" \
            -f sha="$TESTED_SHA" -F force=true >/dev/null
          expected=$(sha256sum release-asset/SideDock-Setup-1.0.2.exe | cut -d' ' -f1)
          cp docs/RELEASE_NOTES_v1.0.2.md release-asset/RELEASE_NOTES.md
          {
            echo
            echo "### Verified revised-build provenance"
            echo
            echo "- Windows CI: https://github.com/$GITHUB_REPOSITORY/actions/runs/${{ github.event.workflow_run.id }}"
            echo "- Exact tested source commit: \`$TESTED_SHA\`"
            echo "- Current installer SHA-256: \`$expected\`"
          } >> release-asset/RELEASE_NOTES.md
          gh release edit v1.0.2 --repo "$GITHUB_REPOSITORY" \
            --target "$TESTED_SHA" --latest \
            --notes-file release-asset/RELEASE_NOTES.md

          actual=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.2" \
            --jq '.assets[] | select(.name == "SideDock-Setup-1.0.2.exe") | .digest')
          count=$(gh release view v1.0.2 --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets | length')
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.2" --jq '.object.sha')
          test "$actual" = "sha256:$expected"
          test "$count" -eq 2
          test "$tag_sha" = "$TESTED_SHA"
          gh release view v1.0.2 --repo "$GITHUB_REPOSITORY" \
            --json url,tagName,isDraft,isPrerelease,assets
