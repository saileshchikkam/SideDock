name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main, release/v1.0-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e . -r requirements-build.txt
      - name: Install offline OCR engine for the Windows release
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress --limit-output
          $ocr = Join-Path ${env:ProgramFiles} 'Tesseract-OCR'
          if (!(Test-Path (Join-Path $ocr 'tesseract.exe'))) { throw 'Tesseract executable not installed' }
          if (!(Test-Path (Join-Path $ocr 'tessdata\eng.traineddata'))) { throw 'Tesseract English model missing' }
          "SIDEDOCK_OCR_DIR=$ocr" >> $env:GITHUB_ENV
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Native Windows topmost/focus regression
        env:
          QT_QPA_PLATFORM: windows
        run: python -m unittest discover -s tests -p test_window_stability.py -k native_reveal -v
      - name: Check source smoke test
        run: python -m sidedock --smoke-test
      - name: Check source OCR against bundled language data
        shell: pwsh
        run: |
          python scripts/create_ocr_fixture.py
          python -m sidedock --smoke-test-ocr build/ocr-smoke-fixture.png
          if ($LASTEXITCODE -ne 0) { Get-Content build/ocr-smoke-diagnostic.txt; exit 1 }
      - name: Build and verify executable
        run: python scripts/build_windows.py
      - name: Build and smoke-test per-user installer
        run: python scripts/build_installer.py
      - name: Regression-test v1.0.1 to v1.0.2 in-place upgrade
        shell: pwsh
        run: |
          $version = (python -c "from sidedock.version import __version__; print(__version__)").Trim()
          if ($version -eq "1.0.2") {
            python scripts/test_upgrade_v1_0_2.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Publish installer SHA-256 for safe verification
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter "SideDock-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw 'Installer binary is missing' }
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          "### SideDock installer SHA-256" >> $env:GITHUB_STEP_SUMMARY
          "File: $($installer.Name)" >> $env:GITHUB_STEP_SUMMARY
          "SHA-256: $hash" >> $env:GITHUB_STEP_SUMMARY
          Write-Host ("Installer SHA-256: {0}  {1}" -f $hash, $installer.Name)
      - uses: actions/upload-artifact@v4
        with:
          name: SideDock-Windows-Installer
          path: dist/SideDock-Setup-*.exe
          retention-days: 14
          if-no-files-found: error
