name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main, release/v1.0-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e . -r requirements-build.txt
      - name: Install offline OCR engine for the Windows release
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress --limit-output
          $ocr = Join-Path ${env:ProgramFiles} 'Tesseract-OCR'
          if (!(Test-Path (Join-Path $ocr 'tesseract.exe'))) { throw 'Tesseract executable not installed' }
          if (!(Test-Path (Join-Path $ocr 'tessdata\eng.traineddata'))) { throw 'Tesseract English model missing' }
          "SIDEDOCK_OCR_DIR=$ocr" >> $env:GITHUB_ENV
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check source smoke test
        run: python -m sidedock --smoke-test
      - name: Check source OCR against bundled language data
        shell: pwsh
        run: |
          python scripts/create_ocr_fixture.py
          python -m sidedock --smoke-test-ocr build/ocr-smoke-fixture.png
          if ($LASTEXITCODE -ne 0) { Get-Content build/ocr-smoke-diagnostic.txt; exit 1 }
      - name: Build and verify executable
        run: python scripts/build_windows.py
      - name: Build and smoke-test per-user installer
        run: python scripts/build_installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: SideDock-Windows-Installer
          path: dist/SideDock-Setup-*.exe
          retention-days: 14
          if-no-files-found: error
