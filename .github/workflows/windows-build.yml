name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main, release/v1.0-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e . -r requirements-build.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check source smoke test
        run: python -m sidedock --smoke-test
      - name: Build and verify executable
        run: python scripts/build_windows.py
      - name: Build and smoke-test per-user installer
        run: python scripts/build_installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: SideDock-Windows
          path: |
            dist/SideDock.exe
            dist/SideDock-Setup-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
