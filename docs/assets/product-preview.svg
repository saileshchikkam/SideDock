<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">SideDock concept preview</title>
<desc id="desc">A minimal SideDock interface concept showing saved notes, screenshot OCR, and favorites alongside a description of the product.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101114"/><stop offset="1" stop-color="#090a0b"/></linearGradient>
<linearGradient id="line" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#555861"/><stop offset="1" stop-color="#1c1d22"/></linearGradient>
<filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
</defs>
<rect width="1200" height="620" rx="26" fill="url(#bg)"/>
<circle cx="960" cy="308" r="254" fill="#32333e" opacity=".18" filter="url(#shadow)"/>
<rect x="55" y="55" width="170" height="32" rx="16" fill="#22252a" stroke="#353941"/>
<circle cx="74" cy="71" r="4" fill="#a3a3ad"/><text x="88" y="76" font-family="Arial, sans-serif" font-size="13" fill="#dddde3">WINDOWS 10 / 11</text>
<text x="55" y="178" font-family="Arial, sans-serif" font-weight="700" font-size="61" fill="#f8f8f9">Everything you copy.</text>
