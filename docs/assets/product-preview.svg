<text x="55" y="302" font-family="Arial, sans-serif" font-size="22" fill="#b8b8c0">A local-first clipboard, notes and OCR</text>
<text x="55" y="334" font-family="Arial, sans-serif" font-size="22" fill="#b8b8c0">workspace that stays out of your way.</text>
